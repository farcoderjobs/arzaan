<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — POS</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin: 0; }
      button {
        margin-top: 1.25rem;
        padding: 0.6rem 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        The POS app shell could not be loaded from the network. Reconnect and
        try again — queued offline sales are safe on this device.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
